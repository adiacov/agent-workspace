name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag, version, and changelog
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="$(tr -d '[:space:]' < VERSION)"

          if [ "$tag" != "$version" ]; then
            printf 'error: tag %s does not match VERSION %s\n' "$tag" "$version" >&2
            exit 1
          fi

          grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' VERSION || {
            printf 'error: VERSION must use vMAJOR.MINOR.PATCH format\n' >&2
            exit 1
          }

          if ! grep -F "## $tag -" CHANGELOG.md >/dev/null; then
            printf 'error: CHANGELOG.md has no section for %s\n' "$tag" >&2
            exit 1
          fi

          awk -v tag="$tag" '
            $0 ~ "^## " tag " -" { in_section=1; print; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            printf 'error: release notes are empty for %s\n' "$tag" >&2
            exit 1
          fi

      - name: Run smoke tests
        shell: bash
        run: bash tests/smoke/run-smoke.sh

      - name: Run integration tests
        shell: bash
        run: |
          set -euo pipefail
          for test_script in tests/integration/test_*.sh; do
            printf 'integration: %s\n' "$(basename "$test_script")"
            bash "$test_script"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
